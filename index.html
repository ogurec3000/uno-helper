<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>UNO Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Lilita+One&display=swap">
<style>
:root{--bg1:#fff3d6;--bg2:#ffd9d2;--text:#1b1220;--muted:#7a6a72;--panel:#ffffffcc;--line:#00000018;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1a0f1f;--bg2:#2b0d14;--text:#fff;--muted:#b9a8b0;--panel:#ffffff12;--line:#ffffff22}}
:root[data-theme="dark"]{--bg1:#1a0f1f;--bg2:#2b0d14;--text:#fff;--muted:#b9a8b0;--panel:#ffffff12;--line:#ffffff22}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--text);font-family:"Baloo 2","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;
background:radial-gradient(circle at 15% 10%,#ed1c2433,transparent 45%),radial-gradient(circle at 90% 30%,#0a6fd633,transparent 45%),radial-gradient(circle at 20% 95%,#2e9e4f33,transparent 45%),radial-gradient(circle at 85% 100%,#f7c60044,transparent 40%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed}
main{max-width:760px;margin:0 auto;padding:22px 16px 48px}
.logo{display:flex;justify-content:center;margin:6px 0 4px}
.logo div{transform:rotate(-5deg);background:#ed1c24;border:5px solid #fff;border-radius:26px;padding:2px 30px 6px;box-shadow:0 10px 0 #8d0f14,0 18px 30px #0006;position:relative}
.logo b{display:block;font:900 clamp(3rem,12vw,4.6rem)/1 "Arial Black",Impact,system-ui,sans-serif;font-style:italic;color:#f7c600;letter-spacing:-2px;-webkit-text-stroke:3px #1b1220;paint-order:stroke fill;text-shadow:4px 4px 0 #1b1220}
.tag{text-align:center;color:var(--muted);margin:18px 0 20px;font-size:1.05rem}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.card{--c:#ed1c24;--on:#fff;position:relative;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 100%,#fff 18%),var(--c) 55%,color-mix(in srgb,var(--c) 80%,#000));color:var(--on);border:6px solid #fff;border-radius:26px;padding:16px 16px 14px;box-shadow:0 12px 0 color-mix(in srgb,var(--c) 55%,#000),0 20px 28px #0004;transition:transform .2s}
.card:nth-child(odd){transform:rotate(-1.2deg)}.card:nth-child(even){transform:rotate(1.2deg)}
.card:hover{transform:rotate(0) translateY(-3px)}
.corner{position:absolute;font:900 1.3rem "Arial Black",system-ui;font-style:italic;opacity:.9}
.corner.tl{top:8px;left:12px}.corner.br{bottom:8px;right:12px;transform:rotate(180deg)}
.head{display:flex;align-items:center;gap:10px;padding:0 6px}
.av{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:1.6rem;box-shadow:0 3px 0 #0003;flex:none}
.name{flex:1;min-width:0;background:transparent;border:0;border-bottom:2px dashed #ffffff88;color:var(--on);font:800 1.45rem inherit;font-family:inherit;padding:2px 0;outline:none}
.name:focus{border-bottom-style:solid}
.crown{position:absolute;top:-22px;right:18px;font-size:2rem;transform:rotate(14deg);filter:drop-shadow(0 3px 2px #0005);display:none}
.card.lead .crown{display:block;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:rotate(14deg) translateY(-5px)}}
.oval{margin:10px auto 8px;width:78%;aspect-ratio:1.5;max-height:150px;background:#fff;border-radius:50%;transform:rotate(-24deg);display:grid;place-items:center;box-shadow:inset 0 -6px 0 #0000001a}
.score{transform:rotate(24deg);font:900 clamp(3rem,11vw,4.2rem)/1 "Arial Black",Impact,system-ui,sans-serif;font-style:italic;color:var(--c);text-shadow:3px 3px 0 #1b122022}
.score.pop{animation:pop .35s}
@keyframes pop{40%{transform:rotate(24deg) scale(1.35)}}
.row{display:flex;gap:8px;margin-top:6px}
.row input{flex:1;min-width:0;border:0;border-radius:14px;padding:11px 14px;font:700 1.1rem inherit;font-family:inherit;background:#ffffffee;color:#1b1220;outline:none;box-shadow:inset 0 3px 0 #0002}
.row input::placeholder{color:#8a7f86}
.add{border:0;border-radius:14px;padding:0 20px;font:900 1.1rem inherit;font-family:inherit;background:#1b1220;color:#fff;cursor:pointer;box-shadow:0 4px 0 #000a}
.add:active,.chip:active{transform:translateY(3px);box-shadow:none}
.chips{display:flex;gap:7px;margin-top:10px}
.chip{flex:1;border:2px solid #ffffffcc;background:#ffffff26;color:var(--on);border-radius:12px;padding:6px 0;font:800 .95rem inherit;font-family:inherit;cursor:pointer;box-shadow:0 3px 0 #0003}
.chip.neg{background:#0003}
.actions{display:flex;gap:12px;margin:34px 0 14px;align-items:center}
.make{flex:1;border:5px solid #fff;border-radius:22px;padding:14px;font:900 1.35rem inherit;font-family:inherit;background:#f7c600;color:#1b1220;cursor:pointer;box-shadow:0 8px 0 #a88400,0 16px 24px #0004;animation:pulse 2.2s infinite}
.make:active{transform:translateY(6px);box-shadow:0 2px 0 #a88400}
@keyframes pulse{50%{transform:scale(1.025)}}
.reset{border:2px solid var(--line);background:var(--panel);color:var(--muted);border-radius:16px;padding:14px 16px;font:700 1rem inherit;font-family:inherit;cursor:pointer}
.board{display:none;background:var(--panel);border:2px solid var(--line);border-radius:30px;padding:22px 14px 14px;backdrop-filter:blur(6px);margin-top:10px}
.board.show{display:block;animation:rise .5s}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.board h2{margin:0 0 8px;text-align:center;font:900 1.9rem "Arial Black",system-ui,sans-serif;font-style:italic}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;height:300px;padding-top:6px}
.pc{flex:1;max-width:190px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.pc .pav{font-size:2.2rem}.pc .pn{font-weight:800;font-size:1.1rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .pp{font-weight:800;color:var(--muted);margin-bottom:6px}
.blk{width:100%;border-radius:18px 18px 0 0;border:4px solid #fff;border-bottom:0;background:var(--c);display:grid;place-items:start center;padding-top:10px;color:#fff;font:900 2.6rem "Arial Black",system-ui;font-style:italic;height:0;transition:height .9s cubic-bezier(.2,1.3,.4,1);text-shadow:3px 3px 0 #0004}
.fourth{display:flex;align-items:center;gap:12px;margin:14px 6px 2px;padding:10px 16px;border-radius:18px;background:var(--panel);border:2px solid var(--line)}
.fourth .r{font:900 1.4rem "Arial Black",system-ui;color:var(--muted)}.fourth .n{flex:1;font-weight:800;font-size:1.1rem}.fourth .p{font-weight:900;font-size:1.3rem}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}

[hidden]{display:none!important}
#menu{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px;position:relative;overflow:hidden}
#menu>*:not(.fc){position:relative;z-index:1}
#menu.leave{animation:suck .7s ease-in forwards}
@keyframes suck{to{transform:scale(.5) rotate(10deg);opacity:0}}
#menu .logo b{font-size:clamp(4.5rem,22vw,8rem)}
#menu .logo div{padding:4px 40px 10px;animation:wob 3s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-2deg) scale(1.04)}}
.sub2{font:800 1.3rem inherit;font-family:inherit;margin:26px 0 4px}
.names{color:var(--muted);margin:0 0 30px}
.play{border:6px solid #fff;border-radius:999px;padding:16px 54px;font:900 2rem "Arial Black",system-ui,sans-serif;font-style:italic;background:#2e9e4f;color:#fff;cursor:pointer;box-shadow:0 10px 0 #17642f,0 20px 30px #0005;animation:pulse 1.8s infinite;letter-spacing:1px}
.play:active{transform:translateY(8px);box-shadow:0 2px 0 #17642f}
.fc{position:absolute;z-index:0;width:76px;height:112px;border-radius:14px;border:4px solid #fff;background:var(--c);display:grid;place-items:center;color:#fff;font:900 1.7rem "Arial Black",system-ui;font-style:italic;transform:rotate(var(--r));animation:fl 4s ease-in-out infinite var(--d);box-shadow:0 8px 0 #0003;opacity:.92}
@keyframes fl{50%{transform:rotate(var(--r)) translateY(-18px)}}
.back{border:2px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;padding:8px 16px;font:800 1rem inherit;font-family:inherit;cursor:pointer}
#game:not([hidden]){animation:rise .6s}
#portal{position:fixed;inset:0;z-index:20;pointer-events:none;display:grid;place-items:center;visibility:hidden;overflow:hidden}
#portal .hole{width:60px;height:60px;border-radius:50%;background:conic-gradient(#ed1c24,#f7c600,#2e9e4f,#0a6fd6,#ed1c24);transform:scale(0)}
#portal.in,#portal.out{visibility:visible}
#portal.in .hole{animation:warpIn .7s ease-in forwards}
#portal.out .hole{animation:warpOut .7s ease-out forwards}
@keyframes warpIn{to{transform:scale(45) rotate(540deg)}}
@keyframes warpOut{from{transform:scale(45) rotate(540deg)}to{transform:scale(0) rotate(1080deg)}}

body{font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif}
.score,.corner,.logo b,.play,.board h2,.blk,.fourth .r,.chip,.make,.add,.fl,.sub2,.reset,.back,.name{font-family:"Lilita One","Arial Black",Impact,sans-serif!important;font-weight:400!important}
body::before,body::after{content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.33;z-index:0;pointer-events:none;animation:drift 18s ease-in-out infinite alternate}
body::before{background:#ed1c24;left:-22vmax;top:-22vmax}
body::after{background:#0a6fd6;right:-22vmax;bottom:-22vmax;animation-delay:-9s}
@keyframes drift{to{transform:translate(12vmax,8vmax) scale(1.15)}}
@keyframes spin{to{transform:rotate(360deg)}}
#bg{z-index:0}main,#menu{z-index:1}main{position:relative}
.logo div::before{content:"";position:absolute;inset:6px 10px;background:#1b1220;border:4px solid #fff;border-radius:50%;transform:rotate(-14deg);box-shadow:0 0 25px #f7c60088}
.logo b{position:relative;z-index:1;-webkit-text-stroke:2px #8d0f14;text-shadow:4px 4px 0 #8d0f14}
#menu::before{content:"";position:absolute;width:150vmax;height:150vmax;left:50%;top:38%;margin:-75vmax 0 0 -75vmax;background:repeating-conic-gradient(#ffffff17 0 8deg,transparent 8deg 16deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 50%);mask-image:radial-gradient(circle,#000 0,transparent 50%);animation:spin 50s linear infinite;pointer-events:none}
.sub2{font-size:2rem;margin:30px 0 4px;background:linear-gradient(90deg,#ff5a5f,#ffd23f,#4cd964,#4aa3ff,#ff5a5f);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite}
@keyframes flow{to{background-position:300% 0}}
.names{font-weight:700;letter-spacing:.5px}
.play{position:relative;overflow:hidden;background:linear-gradient(180deg,#46d36e,#1f9a46)}
.play::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fff9,transparent);transform:skewX(-20deg);animation:shine 2.6s infinite}
@keyframes shine{to{left:130%}}
.card::before{content:"";position:absolute;inset:0;border-radius:20px;background:linear-gradient(115deg,transparent 30%,#ffffff66 46%,transparent 62%);background-size:260% 100%;background-position:var(--sx,120%) 0;pointer-events:none;transition:background-position .15s}
.card::after{content:"";position:absolute;inset:6px;border-radius:18px;border:2px solid #ffffff44;pointer-events:none}
.oval{background:radial-gradient(circle at 35% 30%,#fff,#fff 55%,#f1ece8);outline:4px solid #ffffff55;outline-offset:5px}
.score{-webkit-text-stroke:2px color-mix(in srgb,var(--c) 70%,#000);text-shadow:3px 4px 0 #0003}
.prog{height:14px;border-radius:99px;background:#0004;margin:12px 8px 4px;overflow:hidden;border:2px solid #ffffff77}
.prog i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#fff,#ffffffbb);transition:width .7s cubic-bezier(.2,1.2,.4,1)}
.goal{text-align:center;font-size:.85rem;opacity:.9;margin-bottom:6px;font-weight:700}
.fl{position:absolute;left:50%;top:42%;font-size:2.4rem;color:#fff;text-shadow:0 3px 0 #0007;pointer-events:none;z-index:3;animation:flo 1s ease-out forwards}
@keyframes flo{from{opacity:1;transform:translate(-50%,0) scale(.6)}to{opacity:0;transform:translate(-50%,-100px) scale(1.5)}}
.board{background:linear-gradient(160deg,#ffffff22,#ffffff0a);box-shadow:0 20px 60px #0005,inset 0 0 0 2px #ffffff22}
.podium{position:relative}
.podium::before{content:"";position:absolute;left:50%;bottom:10%;width:380px;height:380px;margin-left:-190px;border-radius:50%;background:repeating-conic-gradient(#f7c60048 0 10deg,transparent 10deg 20deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 70%);mask-image:radial-gradient(circle,#000 0,transparent 70%);animation:spin 22s linear infinite}
.pc{position:relative;z-index:1}
.pc:nth-child(2) .pav{font-size:3.4rem;animation:bob2 1.1s ease-in-out infinite}
@keyframes bob2{50%{transform:translateY(-10px) rotate(6deg)}}
.pp{color:var(--text);opacity:.8}
.blk{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 65%,#fff),var(--c) 40%);box-shadow:0 0 34px color-mix(in srgb,var(--c) 55%,transparent);font-size:3.2rem}
.make{background:linear-gradient(180deg,#ffe04a,#f7b500)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.topbar{display:flex;gap:8px;align-items:center;margin-bottom:4px}.sp{flex:1}
.gear{margin-top:24px;font-size:1.1rem;padding:10px 22px}
.av{border:0;cursor:pointer;padding:0;color:inherit;transition:transform .15s}.av:active{transform:scale(.8) rotate(-12deg)}
#modal{position:fixed;inset:0;z-index:30;background:#000b;display:grid;place-items:center;padding:16px;backdrop-filter:blur(4px)}
.sheet{width:100%;max-width:420px;max-height:90vh;overflow:auto;background:var(--bg1);color:var(--text);border:5px solid #fff;border-radius:26px;padding:18px;box-shadow:0 14px 0 #0004,0 30px 60px #000a;animation:rise .35s}
.sheet h3{margin:0 0 8px;font:400 1.9rem "Lilita One",system-ui}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-weight:700}
.set input[type=checkbox]{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:99px;background:#8885;position:relative;cursor:pointer;transition:.2s;flex:none}
.set input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 3px #0005;transition:.2s}
.set input[type=checkbox]:checked{background:#2e9e4f}.set input[type=checkbox]:checked::after{left:25px}
.seg{display:flex;gap:4px}
.seg button,.danger,.done{border:0;border-radius:12px;padding:8px 12px;font:400 1rem "Lilita One",system-ui;cursor:pointer;background:#8883;color:var(--text)}
.seg button.on{background:#0a6fd6;color:#fff}
.qin{display:flex;gap:6px}.qin input{width:58px;padding:8px 4px;border-radius:10px;border:2px solid var(--line);background:#8881;color:var(--text);font:700 1rem inherit;text-align:center}
.danger{width:100%;margin-top:12px;background:#ed1c2433;color:#ff5a5f}
.done{width:100%;margin-top:10px;background:#2e9e4f;color:#fff;font-size:1.25rem;padding:12px}
.hist{margin:0 0 16px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:10px 16px}
.hist summary{cursor:pointer;font-weight:700}
.hist ul{list-style:none;margin:8px 0 0;padding:0;max-height:180px;overflow:auto}
.hist li{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.hist li i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}.hist li b{margin-left:auto}
.hist .empty{color:var(--muted)}
body.calm *:not(.fl),body.calm::before,body.calm::after{animation:none!important}body.calm #bg{display:none}
:root[data-skin="ocean"]{--bg1:#04202e;--bg2:#063a52;--o1:#0a6fd6;--o2:#1fc8c8;--text:#fff;--muted:#b9b9c9;--panel:#ffffff14;--line:#ffffff2a}
:root[data-skin="sunset"]{--bg1:#2a0f2e;--bg2:#5a1a2b;--o1:#ff7a3d;--o2:#ff3d81;--text:#fff;--muted:#b9b9c9;--panel:#ffffff14;--line:#ffffff2a}
:root[data-skin="forest"]{--bg1:#06210f;--bg2:#0d3a1e;--o1:#2e9e4f;--o2:#b6e03d;--text:#fff;--muted:#b9b9c9;--panel:#ffffff14;--line:#ffffff2a}
:root[data-skin="neon"]{--bg1:#0b0b1a;--bg2:#1a0630;--o1:#ff2bd6;--o2:#19f0ff;--text:#fff;--muted:#b9b9c9;--panel:#ffffff14;--line:#ffffff2a}
:root[data-skin="gold"]{--bg1:#1c1405;--bg2:#3a2a08;--o1:#f7c600;--o2:#ed1c24;--text:#fff;--muted:#b9b9c9;--panel:#ffffff14;--line:#ffffff2a}
:root[data-skin="midnight"]{--bg1:#000000;--bg2:#0a0a12;--o1:#3a3aff;--o2:#7a1fff;--text:#fff;--muted:#b9b9c9;--panel:#ffffff14;--line:#ffffff2a}
:root[data-skin="candy"]{--bg1:#fff0f6;--bg2:#e8f6ff;--o1:#ff8fc7;--o2:#8fd3ff;--text:#3a2140;--muted:#8a7090;--panel:#ffffffcc;--line:#00000018}
body::before{background:var(--o1,#ed1c24)}body::after{background:var(--o2,#0a6fd6)}
:root[data-skin] body{background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed}
.name::placeholder{color:currentColor;opacity:.6}
.av{background-size:cover;background-position:center;font-size:1.7rem}
.pim{width:58px;height:58px;border-radius:50%;object-fit:cover;border:3px solid #fff;vertical-align:middle}.fourth .pim{width:34px;height:34px}
#pick{position:fixed;inset:0;z-index:31;background:#000b;display:grid;place-items:center;padding:16px;backdrop-filter:blur(4px)}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;max-height:250px;overflow:auto;padding:4px}
.eb{font-size:1.7rem;border:0;border-radius:12px;background:#8882;padding:6px 0;cursor:pointer}.eb:active{transform:scale(.85)}
.own,#s-lang{flex:1;min-width:0;padding:9px 10px;border-radius:10px;border:2px solid var(--line);background:#8881;color:var(--text);font:700 1rem inherit;font-family:inherit}
#s-lang{flex:none}#s-lang option{color:#000}
.seg-b{border:0;border-radius:12px;padding:9px 14px;font:400 1rem "Lilita One",system-ui;cursor:pointer;background:#0a6fd6;color:#fff;flex:1}
.set.col{flex-direction:column;align-items:flex-start}
.sws{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid #fff;cursor:pointer;box-shadow:0 3px 0 #0004;padding:0}.sw.on{outline:4px solid #f7c600;outline-offset:2px}

.card{border-radius:30px;border-width:7px;padding:18px 18px 16px;box-shadow:0 12px 0 color-mix(in srgb,var(--c) 55%,#000),0 0 44px color-mix(in srgb,var(--c) 45%,transparent),0 24px 30px #0004;animation:cin .6s cubic-bezier(.2,1.2,.4,1) backwards}
@keyframes cin{from{opacity:0;transform:translateY(50px) scale(.8) rotate(-8deg)}}
.rm{flex:none;min-width:30px;height:30px;border-radius:99px;border:0;background:#0003;color:inherit;font:700 .8rem inherit;font-family:inherit;cursor:pointer;padding:0 8px}
.addp{min-height:200px;border:4px dashed #ffffff99;border-radius:30px;background:var(--panel);color:var(--text);font:400 1.5rem "Lilita One",system-ui;cursor:pointer;backdrop-filter:blur(6px);transition:.2s;animation:cin .6s backwards}
.addp:hover{transform:scale(1.03);border-color:#f7c600;box-shadow:0 0 30px #f7c60066}
.oval{box-shadow:inset 0 -8px 0 #0000001a,0 8px 18px #0003}
.score{text-shadow:3px 4px 0 #0003,0 0 22px color-mix(in srgb,var(--c) 40%,transparent)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;padding:8px 10px;margin:0 0 10px;border-radius:20px;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:2px solid var(--line);box-shadow:0 6px 20px #0003}
main .logo b{font-size:2.8rem}main .logo div{padding:0 22px 4px;box-shadow:0 6px 0 #8d0f14,0 12px 20px #0005}
.tag{margin:12px 0 10px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.chipx{flex:none;display:flex;align-items:center;gap:7px;padding:5px 14px 5px 5px;border-radius:99px;background:var(--panel);border:2px solid var(--line);font-weight:700;backdrop-filter:blur(8px);box-shadow:0 3px 0 var(--c)}

SW.forEach(function(w){var b=document.createElement("button");b.className="sw";b.dataset.k=w[0];b.setAttribute("aria-label",w[0]);b.style.background="linear-gradient(135deg,"+w[1]+","+w[2]+")";b.onclick=function(){cfg.skin=w[0];saveCfg();applyCfg();syncX();beep(600)};document.getElementById("s-skin").appendChild(b)});
document.getElementById("s-lang").onchange=function(){cfg.lang=this.value;saveCfg();applyLang();render();histUI();document.getElementById("board").className="board"};
function vib(x){if(cfg.haptic&&navigator.vibrate)try{navigator.vibrate(x)}catch(e){}}
var WL=null;function wake(){try{if(cfg.awake&&navigator.wakeLock){navigator.wakeLock.request("screen").then(function(l){WL=l}).catch(function(){})}else if(WL){WL.release();WL=null}}catch(e){}}
document.addEventListener("visibilitychange",function(){if(!document.hidden&&cfg.awake)wake()});
try{matchMedia("(prefers-color-scheme:dark)").addEventListener("change",function(){applyCfg()})}catch(e){}
document.getElementById("s-snd").onchange=function(){cfg.snd=this.value;saveCfg();beep(660)};
function burst(c,v){if(!cfg.bg)return;var e=v>0?"✨":"💥";for(var i=0;i<7;i++){var q=document.createElement("i"),a=Math.random()*6.28,r=50+Math.random()*60;q.className="sp";q.textContent=e;q.style.setProperty("--dx",Math.cos(a)*r+"px");q.style.setProperty("--dy",Math.sin(a)*r+"px");c.appendChild(q);setTimeout(function(x){x.remove()},800,q)}}
var tt=0;function toast(m){var e=document.getElementById("toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){e.classList.remove("on")},2600)}
var rolling=0;
document.getElementById("rand").onclick=function(){if(rolling)return;rolling=1;var n=state.players.length,pk=Math.floor(Math.random()*n),steps=n*3+pk+1,k=0,d=70;
(function go(){cards.forEach(function(c){c.classList.remove("pick")});var cur=k%n;cards[cur].classList.add("pick");beep(380+cur*50,.06);vib(8);
if(k>=steps-1){rolling=0;toast("🎲 "+(state.players[cur].n||t("player")+" "+(cur+1))+" "+t("starts"));cards[cur].scrollIntoView({block:"nearest",behavior:"smooth"});fanfare();if(cfg.fx)confetti();setTimeout(function(){cards[cur].classList.remove("pick")},2600);return}
k++;d*=n>6?1.05:1.09;setTimeout(go,d)})()};
var menu=document.getElementById("menu"),game=document.getElementById("game"),portal=document.getElementById("portal");
function warp(toGame){
portal.className="in";if(toGame)menu.classList.add("leave");
setTimeout(function(){if(toGame){entered=0;render()}menu.hidden=toGame;game.hidden=!toGame;menu.classList.remove("leave");scrollTo(0,0);
portal.className="out";setTimeout(function(){portal.className=""},720)},720)}
document.getElementById("play").onclick=function(){beep(520,.2);warp(true)};
document.getElementById("back").onclick=function(){warp(false)};
render();histUI();applyCfg();applyLang();wake();
</script>
</body>
